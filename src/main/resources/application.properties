# ============================================================================
# IRONKEY Application & Database Configuration
# ============================================================================
# Safe default configuration. Sensitive values can be overridden via:
# 1. Environment variables: IRONKEY_DB_HOST, IRONKEY_DB_PORT, IRONKEY_DB_NAME,
#    IRONKEY_DB_USER, IRONKEY_DB_PASS
# 2. Local config file: config/application-local.properties (ignored by git)
# ============================================================================

# Application Info
app.name=IRONKEY
app.tagline=Your Credentials. Your Control.
app.version=1.0.0
app.environment=development

# MySQL Database Connection Settings
db.host=localhost
db.port=3306
db.name=ironkey_db
db.user=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Connection Parameters
db.useSSL=false
db.allowPublicKeyRetrieval=true
db.serverTimezone=UTC
db.connectTimeout=3000
db.socketTimeout=5000

# Connection Pool Defaults (for lightweight management)
db.pool.maxConnections=10
db.pool.timeoutSeconds=5
